[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "parqueadero"
version = "0.1.0"
description = "Sistema de parqueaderos offline-first (SQLite local + PostgreSQL en la nube)"
requires-python = ">=3.12"
license = { text = "Proprietary" }
authors = [{ name = "Parqueadero System" }]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "httpx>=0.27.0",
    "uuid-utils>=0.10.0",
]

[project.optional-dependencies]
local = [
    "aiosqlite>=0.20.0",
]
cloud = [
    "asyncpg>=0.30.0",
]
dev = [
    "aiosqlite>=0.20.0",
    "asyncpg>=0.30.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
]

[project.scripts]
parqueadero-local = "parqueadero.interfaces.local.cli:main"
parqueadero-cloud = "parqueadero.interfaces.cloud.cli:main"

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["parqueadero"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
